<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Globe rupture risk calculator after Fs-PKP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', system-ui;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.topbar {
    background: linear-gradient(135deg, #0f172a, #1e40af);
    color: white;
    text-align: center;
    padding: 1.5rem;
}

.topbar h1 {
    font-size: 1.2rem;
}

.container {
    flex: 1;
    display: flex;
    gap: 20px;
    padding: 24px;
    max-width: 1600px;
    margin: auto;
}

.left, .right {
    flex: 1;
    background: white;
    border-radius: 16px;
    padding: 2rem;
    border: 1px solid #e2e8f0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.05);
}

/* 标题 */
.form-title {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
}

.form-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    margin: 8px auto;
    background: linear-gradient(90deg, #3b82f6, #06b6d4);
}

.result-title {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
}

.result-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    margin: 8px auto;
    background: linear-gradient(90deg, #3b82f6, #06b6d4);
}

/* 表单 */
#formContainer {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}

label {
    font-size: 0.85rem;
    color: #334155;
}

select {
    padding: 0.7rem;
    border-radius: 8px;
    border: 2px solid #e2e8f0;
    background: #fafafa;
}

select:focus {
    border-color: #3b82f6;
    background: white;
    outline: none;
}

/* 按钮 */
button {
    grid-column: 1 / -1;
    padding: 1rem;
    margin-top: 1.5rem;
    background: linear-gradient(135deg, #2563eb, #0891b2);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
}

/* 图片 */
#result img {
    width: 100%;
    margin-top: 1rem;
    border-radius: 10px;
}

/* 概率 */
#probDiv {
    margin-top: 2rem;
    padding: 1rem;
    text-align: center;
    background: #eff6ff;
    border-radius: 10px;
    font-weight: 600;
}

/* 响应式 */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    #formContainer {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <h1>Globe rupture risk calculator after Fs-PKP</h1>
</div>

<div class="container">

    <div class="left">
        <form id="inputForm">
            <div id="formContainer">
                <div class="form-title">Input Parameters</div>
            </div>
            <button type="button" onclick="submitForm()">Submit</button>
        </form>
        <div id="probDiv"></div>
    </div>

    <div class="right" id="result"></div>

</div>

<script>

window.addEventListener('DOMContentLoaded', () => {

    const columns = {{ columns | tojson }};
    const formContainer = document.getElementById('formContainer');

    columns.forEach(column => {

        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.textContent = column;

        const select = document.createElement('select');
        select.name = column;

        let options = [];

        if (column.trim() === 'Age') {
            options = [
                { label: "＜65", value: 0 },
                { label: "≥65", value: 1 }
            ];
        } else if (column.trim() === 'Occupation') {
            options = [
                { label: "mental work", value: 0 },
                { label: "physical work", value: 1 }
            ];
        } else if (column.includes('Active')) {
            options = [
                { label: "No", value: 0 },
                { label: "Yes", value: 1 }
            ];
        } else if (column.includes('Donor')) {
            options = [
                { label: "No", value: 0 },
                { label: "Yes", value: 1 }
            ];
        } else if (column.includes('Corneal')) {
            options = [
                { label: "＜8mm", value: 0 },
                { label: "≥8mm", value: 1 }
            ];
        } else if (column.includes('Intraoperative')) {
            options = [
                { label: "No", value: 0 },
                { label: "Yes", value: 1 }
            ];
        } else {
            options = [
                { label: "0", value: 0 },
                { label: "1", value: 1 }
            ];
        }

        options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.label;
            select.appendChild(option);
        });

        group.appendChild(label);
        group.appendChild(select);
        formContainer.appendChild(group);
    });

    // 默认请求
    const defaultData = {};
    columns.forEach(c => defaultData[c] = 0);

    fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(defaultData)
    })
    .then(res => res.json())
    .then(data => updateResult(data));
});

function submitForm() {
    const formData = new FormData(document.getElementById('inputForm'));
    const data = {};

    formData.forEach((value, key) => {
        data[key] = Number(value);
    });

    fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => updateResult(data));
}

function updateResult(data) {
    document.getElementById('result').innerHTML = `
        <div class="result-title">
            Globe rupture risk after Fs-PKP = ${data.prediction}
        </div>
        <img src="data:image/png;base64,${data.plot}">
        <img src="data:image/png;base64,${data.force_plot}">
    `;

    document.getElementById('probDiv').innerHTML = `
        Probability of globe rupture after Fs-PKP = ${data.prediction_proba}%
    `;
}

</script>

</body>
</html>
